<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your account — Freaky Fixes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="wordmark">Freaky Fixes</a>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
  </div>
  <nav class="site-nav" aria-label="Primary">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li id="nav-auth-slot"><span id="nav-auth"></span></li>
    </ul>
  </nav>
</header>

<main id="main">
  <section id="dashboard-content" hidden>
    <h1>Welcome, <span id="user-name">there</span></h1>
    <p>This is your account space. From here you'll eventually be able to see upcoming sessions, past messages, and manage your profile.</p>
  </section>
  <section id="dashboard-loading">
    <p>Checking your session…</p>
  </section>
</main>

<footer class="site-footer">
  <p>&copy; 2026 Freaky Fixes. All rights reserved.</p>
</footer>

<script type="module">
  import { watchAuthState } from "./auth.js";

  watchAuthState((user) => {
    const loading = document.getElementById('dashboard-loading');
    const content = document.getElementById('dashboard-content');
    if (user) {
      document.getElementById('user-name').textContent = user.displayName || user.email;
      loading.hidden = true;
      content.hidden = false;
    } else {
      window.location.href = "login.html";
    }
  });

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = document.body.classList.toggle('dark-mode');
    const icon = document.querySelector('#theme-toggle i');
    icon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  });
</script>
<script type="module" src="nav-auth.js"></script>
<script src="chat-widget.js"></script>

</body>
</html>
