<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Freaky Fixes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="wordmark">Freaky Fixes</a>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to continue to your account.</p>

    <button type="button" id="google-btn" class="btn btn-ghost google-btn">
      <i class="fa-brands fa-google" aria-hidden="true"></i> Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="login-form">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <p id="login-error" class="auth-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</main>

<script type="module">
  import { signInUser, signInWithGoogle, friendlyAuthError, watchAuthState } from "./auth.js";

  watchAuthState((user) => {
    if (user) window.location.href = "dashboard.html";
  });

  const errorEl = document.getElementById('login-error');
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    try {
      await signInUser(document.getElementById('email').value, document.getElementById('password').value);
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(friendlyAuthError(err));
    }
  });

  document.getElementById('google-btn').addEventListener('click', async () => {
    errorEl.hidden = true;
    try {
      await signInWithGoogle();
      window.location.href = "dashboard.html";
    } catch (err) {
      showError(friendlyAuthError(err));
    }
  });

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = document.body.classList.toggle('dark-mode');
    const icon = document.querySelector('#theme-toggle i');
    icon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  });
</script>
<script src="chat-widget.js"></script>

</body>
</html>
